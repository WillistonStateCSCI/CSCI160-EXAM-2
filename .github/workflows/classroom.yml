name: Autograding Tests
'on':
- push
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Q1 Test 1
      id: q1-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 1
        setup-command: javac Q1/*.java
        command: java -cp Q1 TeamClient
        input: ''
        expected-output: 'The name of team #1 is Baltimore Orioles'
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q1 Test 2
      id: q1-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 2
        setup-command: javac Q1/*.java
        command: java -cp Q1 TeamClient
        input: ''
        expected-output: 'Team #2: New York Yankees'
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q1 Test 3
      id: q1-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 3
        setup-command: javac Q1/*.java
        command: java -cp Q1 TeamClient
        input: ''
        expected-output: |-
          Setting team #2 name to Orioles.
          Team #1: Baltimore Orioles
          New Team #2: New York Orioles
          Original team #1 and modified team #2 are different.
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q1 Test 4
      id: q1-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q1 Test 4
        setup-command: javac Q1/*.java
        command: java -cp Q1 TeamClient
        input: ''
        expected-output: |-
          The name of team #1 is Baltimore Orioles
          Team #2: New York Yankees
          Original teams #1 and #2 are different.

          Setting team #2 name to Orioles.
          Team #1: Baltimore Orioles
          New Team #2: New York Orioles
          Original team #1 and modified team #2 are different.

          Setting team #2 hometown to Baltimore.
          Team #1: Baltimore Orioles
          New Team #2: Baltimore Orioles
          Original team #1 and modified team #2 are identical.
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 1
      id: q2-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 1
        setup-command: javac Q2/*.java
        command: java -cp Q2 ReturnBooleanArray 1 2 3 4 5 6
        input: ''
        expected-output: "The elements of the int array are 1 2 3 4 5 6 \nThe elements
          of the boolean array are false false false false false false "
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 2
      id: q2-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 2
        setup-command: javac Q2/*.java
        command: " java -cp Q2 ReturnBooleanArray 110 115 120 125 130 150"
        input: ''
        expected-output: "The elements of the int array are 110 115 120 125 130 150
          \nThe elements of the boolean array are true true true true true true "
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 3
      id: q2-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 3
        setup-command: java Q2/*.java
        command: java -cp Q2 ReturnBooleanArray 1 115 3 125 4 150
        input: ''
        expected-output: "The elements of the int array are 1 115 3 125 4 150 \nThe
          elements of the boolean array are false true false true false true  "
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q2 Test 4
      id: q2-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q2 Test 4
        setup-command: javac Q2/*.java
        command: java -cp Q2 ReturnBooleanArray 1 1 112 2 2 223 3 3 334 4 4 445
        input: ''
        expected-output: "The elements of the int array are 1 1 112 2 2 223 3 3 334
          4 4 445 \nThe elements of the boolean array are false false true false false
          true false false true false false true"
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 1
      id: q3-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 1
        setup-command: javac Q3/*.java
        command: java -cp Q3 LetterGrades 90 92 94 96 98
        input: ''
        expected-output: "The integer grades are:\n90 \n92 \n94 \n96 \n98 \n\nThe
          letter grades are:\nA \nA \nA \nA \nA "
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 2
      id: q3-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 2
        setup-command: javac Q3/*.java
        command: java -cp Q3 LetterGrades 90 92 80 75 98
        input: ''
        expected-output: "The integer grades are:\n90 \n92 \n80 \n75 \n98 \n\nThe
          letter grades are:\nA \nA \nB \nC \nA "
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 3
      id: q3-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 3
        setup-command: javac Q3/*.java
        command: java -cp Q3 LetterGrades 90 84 73 62 50
        input: ''
        expected-output: "The integer grades are:\n90 \n84 \n73 \n62 \n50 \n\nThe
          letter grades are:\nA \nB \nC \nD \nF "
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q3 Test 4
      id: q3-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q3 Test 4
        setup-command: " javac Q3/*.java"
        command: java -cp Q3 LetterGrades 90 84 73 62 50 68 78 88 98
        input: ''
        expected-output: "The integer grades are:\n90 \n84 \n73 \n62 \n50 \n68 \n78
          \n88 \n98 \n\nThe letter grades are:\nA \nB \nC \nD \nF \nD \nC \nB \nA "
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 1
      id: q4-test-1
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 1
        setup-command: javac Q4/*.java
        command: java -cp Q4 BoardGameClient
        input: ''
        expected-output: |-
          Board Game 1:
          Description: Chess
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 2
      id: q4-test-2
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 2
        setup-command: javac Q4/*.java
        command: java -cp Q4 BoardGameClient
        input: ''
        expected-output: |-
          Board Game 1:
          Description: Chess
          Minimum players: 2; Maximum players: 2; Is time limited: true
          Board Game 2:
          Description: Monopoly
          Minimum players: 2; Maximum players: 6; Is time limited: false Board Game 3:
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 3
      id: q4-test-3
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 3
        setup-command: javac Q4/*.java
        command: java -cp Q4 BoardGameClient
        input: ''
        expected-output: |-
          Setting BG2 number of players to 2 and adding a time limit:
          New Board Game 2:
          Description: Monopoly
          Minimum players: 2; Maximum players: 2; Is time limited: true
          bg1 and bg2 are not equal
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Q4 Test 4
      id: q4-test-4
      uses: classroom-resources/autograding-io-grader@v1
      with:
        test-name: Q4 Test 4
        setup-command: " javac Q4/*.java"
        command: java -cp Q4 BoardGameClient
        input: ''
        expected-output: |-
          Board Game 1:
          Description: Chess
          Minimum players: 2; Maximum players: 2; Is time limited: true
          Board Game 2:
          Description: Monopoly
          Minimum players: 2; Maximum players: 6; Is time limited: false

          Setting BG2 number of players to 2 and adding a time limit:
          New Board Game 2:
          Description: Monopoly
          Minimum players: 2; Maximum players: 2; Is time limited: true
          bg1 and bg2 are not equal

          Setting BG2 description to Chess:
          New Board Game 2:
          Description: Chess
          Minimum players: 2; Maximum players: 2; Is time limited: true
          bg1 and bg2 are now equal
        comparison-method: contains
        timeout: 10
        max-score: 2
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        Q1-TEST-1_RESULTS: "${{steps.q1-test-1.outputs.result}}"
        Q1-TEST-2_RESULTS: "${{steps.q1-test-2.outputs.result}}"
        Q1-TEST-3_RESULTS: "${{steps.q1-test-3.outputs.result}}"
        Q1-TEST-4_RESULTS: "${{steps.q1-test-4.outputs.result}}"
        Q2-TEST-1_RESULTS: "${{steps.q2-test-1.outputs.result}}"
        Q2-TEST-2_RESULTS: "${{steps.q2-test-2.outputs.result}}"
        Q2-TEST-3_RESULTS: "${{steps.q2-test-3.outputs.result}}"
        Q2-TEST-4_RESULTS: "${{steps.q2-test-4.outputs.result}}"
        Q3-TEST-1_RESULTS: "${{steps.q3-test-1.outputs.result}}"
        Q3-TEST-2_RESULTS: "${{steps.q3-test-2.outputs.result}}"
        Q3-TEST-3_RESULTS: "${{steps.q3-test-3.outputs.result}}"
        Q3-TEST-4_RESULTS: "${{steps.q3-test-4.outputs.result}}"
        Q4-TEST-1_RESULTS: "${{steps.q4-test-1.outputs.result}}"
        Q4-TEST-2_RESULTS: "${{steps.q4-test-2.outputs.result}}"
        Q4-TEST-3_RESULTS: "${{steps.q4-test-3.outputs.result}}"
        Q4-TEST-4_RESULTS: "${{steps.q4-test-4.outputs.result}}"
      with:
        runners: q1-test-1,q1-test-2,q1-test-3,q1-test-4,q2-test-1,q2-test-2,q2-test-3,q2-test-4,q3-test-1,q3-test-2,q3-test-3,q3-test-4,q4-test-1,q4-test-2,q4-test-3,q4-test-4
